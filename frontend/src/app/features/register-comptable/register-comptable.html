<div class="max-w-xl mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
  <div class="bg-white rounded-2xl shadow-xs border border-[var(--color-border-soft)] p-6 sm:p-8 space-y-6">
    <div class="space-y-1 pb-4 border-b border-[var(--color-border-soft)]">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-50 border border-blue-200 text-blue-800 text-[11px] font-bold uppercase tracking-wider mb-1">
        <app-icon name="shield-check" [size]="13" class="text-blue-600" />
        <span>Administration interne</span>
      </div>
      <h2 class="text-2xl font-extrabold text-[var(--color-secondary)]">Nouveau compte comptable</h2>
      <p class="text-xs text-[var(--color-text-muted)]">
        Formulaire réservé au personnel interne habilité de KJ SARL.
      </p>
    </div>

    @if (message()) {
      <div class="bg-emerald-50 border border-emerald-300 text-emerald-800 rounded-xl p-4 text-xs font-bold flex items-center gap-2 shadow-xs">
        <app-icon name="check-circle" [size]="18" class="text-emerald-600 shrink-0" />
        <span>{{ message() }}</span>
      </div>
    }
    @if (erreur()) {
      <div class="bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 text-xs flex items-center gap-2 shadow-xs">
        <app-icon name="alert-circle" [size]="18" class="text-red-600 shrink-0" />
        <span>{{ erreur() }}</span>
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div class="space-y-1">
        <label class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
          <app-icon name="user" [size]="14" class="text-slate-400" />
          <span>Nom complet du collaborateur</span>
        </label>
        <input
          type="text"
          name="nom"
          [(ngModel)]="nom"
          required
          placeholder="Ex: Paul Mbarga"
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-[var(--color-border-soft)] rounded-xl text-xs sm:text-sm font-semibold focus:outline-none focus:border-[var(--color-primary)] focus:bg-white"
        />
      </div>

      <div class="space-y-1">
        <label class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
          <app-icon name="mail" [size]="14" class="text-slate-400" />
          <span>Adresse email professionnelle</span>
        </label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          placeholder="paul.mbarga@kjsarl.cm"
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-[var(--color-border-soft)] rounded-xl text-xs sm:text-sm font-semibold focus:outline-none focus:border-[var(--color-primary)] focus:bg-white"
        />
      </div>

      <div class="space-y-1">
        <label class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
          <app-icon name="lock" [size]="14" class="text-slate-400" />
          <span>Mot de passe provisoire</span>
        </label>
        <input
          type="password"
          name="motDePasse"
          [(ngModel)]="motDePasse"
          required
          minlength="8"
          placeholder="8 caractères minimum"
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-[var(--color-border-soft)] rounded-xl text-xs sm:text-sm font-semibold focus:outline-none focus:border-[var(--color-primary)] focus:bg-white"
        />
      </div>

      <div class="space-y-1">
        <label class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
          <app-icon name="key" [size]="14" class="text-slate-400" />
          <span>Matricule interne</span>
        </label>
        <input
          type="text"
          name="matricule"
          [(ngModel)]="matricule"
          required
          placeholder="Ex: CPT-2026-004"
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-[var(--color-border-soft)] rounded-xl text-xs sm:text-sm font-semibold focus:outline-none focus:border-[var(--color-primary)] focus:bg-white"
        />
      </div>

      <button
        type="submit"
        [disabled]="chargement()"
        class="btn-primary w-full py-3 rounded-xl text-xs sm:text-sm font-bold shadow-md disabled:opacity-60 cursor-pointer mt-2"
      >
        <app-icon name="check" [size]="16" />
        <span>{{ chargement() ? 'Création en cours...' : 'Créer le compte comptable' }}</span>
      </button>
    </form>
  </div>
</div>
