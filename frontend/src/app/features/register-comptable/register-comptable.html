<div class="max-w-md mx-auto mt-10 p-6">
  <div class="bg-white rounded-xl shadow-md border-t-4 border-[var(--color-primary)] p-8">
    <h2 class="text-2xl font-semibold text-[var(--color-secondary)] mb-2">Nouveau compte comptable</h2>
    <p class="text-sm text-[var(--color-text-muted)] mb-6">
      Réservé au personnel interne KJ SARL.
    </p>

    <form (ngSubmit)="onSubmit()" class="flex flex-col gap-1">
      <label class="text-sm font-semibold text-[var(--color-text-muted)]">Nom</label>
      <input type="text" name="nom" [(ngModel)]="nom" required
        class="w-full px-3 py-2 mb-4 border border-[var(--color-border-soft)] rounded-md
               focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]/30 focus:border-[var(--color-primary)]" />

      <label class="text-sm font-semibold text-[var(--color-text-muted)]">Email</label>
      <input type="email" name="email" [(ngModel)]="email" required
        class="w-full px-3 py-2 mb-4 border border-[var(--color-border-soft)] rounded-md
               focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]/30 focus:border-[var(--color-primary)]" />

      <label class="text-sm font-semibold text-[var(--color-text-muted)]">Mot de passe</label>
      <input type="password" name="motDePasse" [(ngModel)]="motDePasse" required minlength="8"
        class="w-full px-3 py-2 mb-4 border border-[var(--color-border-soft)] rounded-md
               focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]/30 focus:border-[var(--color-primary)]" />

      <label class="text-sm font-semibold text-[var(--color-text-muted)]">Matricule</label>
      <input type="text" name="matricule" [(ngModel)]="matricule" required
        class="w-full px-3 py-2 mb-4 border border-[var(--color-border-soft)] rounded-md
               focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]/30 focus:border-[var(--color-primary)]" />

      @if (message()) {
        <p class="text-green-600 text-sm mb-2">{{ message() }}</p>
      }
      @if (erreur()) {
        <p class="text-red-600 text-sm mb-2">{{ erreur() }}</p>
      }

      <button type="submit" [disabled]="chargement()"
        class="w-full mt-2 py-2.5 rounded-md font-semibold text-white
               bg-[var(--color-secondary)] hover:bg-[var(--color-secondary-dark)]
               disabled:opacity-60 transition-colors">
        {{ chargement() ? 'Création...' : 'Créer le compte' }}
      </button>
    </form>
  </div>
</div>
