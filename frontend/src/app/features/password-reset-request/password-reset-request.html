<div class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-white rounded-xl shadow-lg border-t-4 border-[var(--color-primary)] p-10">
    <h2 class="text-2xl font-semibold text-[var(--color-secondary)] mb-6">Mot de passe oublié</h2>

    <form (ngSubmit)="onSubmit()" class="flex flex-col gap-1">
      <label class="text-sm font-semibold text-[var(--color-text-muted)]">Email</label>
      <input type="email" name="email" [(ngModel)]="email" required
        class="w-full px-3 py-2 mb-4 border border-[var(--color-border-soft)] rounded-md
               focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]/30 focus:border-[var(--color-primary)]" />

      @if (message()) {
        <p class="text-green-600 text-sm mb-2">{{ message() }}</p>
      }
      @if (erreur()) {
        <p class="text-red-600 text-sm mb-2">{{ erreur() }}</p>
      }

      <button type="submit" [disabled]="chargement()"
        class="w-full mt-2 py-2.5 rounded-md font-semibold text-white
               bg-[var(--color-secondary)] hover:bg-[var(--color-secondary-dark)]
               disabled:opacity-60 transition-colors">
        {{ chargement() ? 'Envoi...' : 'Envoyer le code' }}
      </button>
    </form>
  </div>
</div>
