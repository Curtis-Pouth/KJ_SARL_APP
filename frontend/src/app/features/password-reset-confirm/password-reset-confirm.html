<div class="auth-page min-h-screen flex items-center justify-center bg-[var(--color-secondary)] px-4 py-12">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-6 sm:p-8 space-y-6">
    <div class="space-y-1">
      <a routerLink="/login" class="inline-flex items-center gap-1.5 text-xs font-bold text-[var(--color-primary-dark)] hover:text-[var(--color-primary)] mb-2 transition-colors">
        <app-icon name="arrow-left" [size]="14" />
        <span>Retour à la connexion</span>
      </a>
      <h2 class="text-2xl font-extrabold text-[var(--color-secondary)]">Réinitialiser le mot de passe</h2>
      <p class="text-xs text-[var(--color-text-muted)]">
        Saisissez le code à 6 chiffres reçu par email et définissez votre nouveau mot de passe.
      </p>
    </div>

    @if (erreur()) {
      <div class="bg-red-50 border border-red-200 text-red-700 rounded-xl p-3.5 text-xs flex items-center gap-2">
        <app-icon name="alert-circle" [size]="16" class="text-red-600 shrink-0" />
        <span>{{ erreur() }}</span>
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div class="space-y-1">
        <label class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
          <app-icon name="mail" [size]="14" class="text-slate-400" />
          <span>Adresse email</span>
        </label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          placeholder="votre.email@exemple.com"
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-[var(--color-border-soft)] rounded-xl text-xs sm:text-sm font-semibold focus:outline-none focus:border-[var(--color-primary)] focus:bg-white"
        />
      </div>

      <div class="space-y-1">
        <label class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
          <app-icon name="key" [size]="14" class="text-slate-400" />
          <span>Code de validation reçu</span>
        </label>
        <input
          type="text"
          name="code"
          [(ngModel)]="code"
          required
          maxlength="6"
          placeholder="Ex: 489201"
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-[var(--color-border-soft)] rounded-xl text-xs sm:text-sm font-mono font-bold tracking-widest text-center focus:outline-none focus:border-[var(--color-primary)] focus:bg-white"
        />
      </div>

      <div class="space-y-1">
        <label class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
          <app-icon name="lock" [size]="14" class="text-slate-400" />
          <span>Nouveau mot de passe (8 car. min.)</span>
        </label>
        <input
          type="password"
          name="nouveauMotDePasse"
          [(ngModel)]="nouveauMotDePasse"
          required
          minlength="8"
          placeholder="••••••••"
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-[var(--color-border-soft)] rounded-xl text-xs sm:text-sm font-semibold focus:outline-none focus:border-[var(--color-primary)] focus:bg-white"
        />
      </div>

      <button
        type="submit"
        [disabled]="chargement()"
        class="btn-primary w-full py-3 rounded-xl text-xs sm:text-sm font-bold shadow-md disabled:opacity-60 cursor-pointer mt-2"
      >
        <app-icon name="check" [size]="16" />
        <span>{{ chargement() ? 'Validation en cours...' : 'Réinitialiser et se connecter' }}</span>
      </button>
    </form>
  </div>
</div>
