<div class="auth-page min-h-screen flex flex-col items-center justify-center bg-[var(--color-secondary)] px-4 py-12">
  <div class="w-full max-w-md space-y-6">
    <div class="text-center space-y-2">
      <div class="relative w-16 h-16 mx-auto rounded-2xl bg-[var(--color-primary)] flex items-center justify-center overflow-hidden shadow-lg border-2 border-white/20">
        <span class="text-[var(--color-secondary)] font-extrabold text-2xl tracking-wider">KJ</span>
      </div>
      <h1 class="text-2xl font-extrabold text-white tracking-wide">K.J SARL</h1>
      <p class="text-xs text-[var(--color-primary-light)] font-medium">Votre satisfaction, notre plaisir · Distribution Professionnelle</p>
    </div>

    <div class="bg-white/10 backdrop-blur-md rounded-2xl p-6 sm:p-8 border border-white/15 shadow-2xl space-y-6">
      <div class="flex bg-black/20 rounded-xl p-1">
        <a routerLink="/login" class="flex-1 text-center py-2 rounded-lg text-xs font-bold text-white/70 hover:text-white transition-colors">
          Connexion
        </a>
        <span class="flex-1 text-center py-2 rounded-lg text-xs font-bold bg-[var(--color-primary)] text-[var(--color-secondary)] shadow-xs">
          Inscription Client
        </span>
      </div>

      <div class="space-y-1">
        <h2 class="text-lg font-bold text-white">Nouveau compte client</h2>
        <p class="text-xs text-white/70">Créez votre compte pour commander vos boissons et emballages.</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="space-y-4">
        <!-- NOM COMPLET -->
        <div class="space-y-1">
          <label class="text-[11px] font-bold text-white/80 uppercase tracking-wider">Nom complet ou Établissement</label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-white/50 flex items-center">
              <app-icon name="user" [size]="16" />
            </span>
            <input
              type="text"
              name="nom"
              [(ngModel)]="nom"
              required
              placeholder="Ex: Bar Le Relais / Jean Dupont"
              class="w-full pl-10 pr-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-white/40 text-xs sm:text-sm focus:outline-none focus:border-[var(--color-primary)] focus:bg-white/15"
            />
          </div>
        </div>

        <!-- EMAIL -->
        <div class="space-y-1">
          <label class="text-[11px] font-bold text-white/80 uppercase tracking-wider">Adresse email</label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-white/50 flex items-center">
              <app-icon name="mail" [size]="16" />
            </span>
            <input
              type="email"
              name="email"
              [(ngModel)]="email"
              required
              placeholder="votre.email@exemple.com"
              autocomplete="email"
              class="w-full pl-10 pr-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-white/40 text-xs sm:text-sm focus:outline-none focus:border-[var(--color-primary)] focus:bg-white/15"
            />
          </div>
        </div>

        <!-- MOT DE PASSE -->
        <div class="space-y-1">
          <label class="text-[11px] font-bold text-white/80 uppercase tracking-wider">Mot de passe (8 caractères min.)</label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-white/50 flex items-center">
              <app-icon name="lock" [size]="16" />
            </span>
            <input
              [type]="motDePasseVisible() ? 'text' : 'password'"
              name="motDePasse"
              [(ngModel)]="motDePasse"
              required
              minlength="8"
              placeholder="Minimum 8 caractères"
              autocomplete="new-password"
              class="w-full pl-10 pr-11 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-white/40 text-xs sm:text-sm focus:outline-none focus:border-[var(--color-primary)] focus:bg-white/15"
            />
            <button
              type="button"
              (click)="basculerVisibiliteMotDePasse()"
              class="absolute right-3.5 top-1/2 -translate-y-1/2 text-white/60 hover:text-white transition-colors cursor-pointer"
              [attr.aria-label]="motDePasseVisible() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
            >
              <app-icon [name]="motDePasseVisible() ? 'eye-off' : 'eye'" [size]="16" />
            </button>
          </div>
        </div>

        <!-- ADRESSE DE LIVRAISON -->
        <div class="space-y-1">
          <label class="text-[11px] font-bold text-white/80 uppercase tracking-wider">Adresse de livraison</label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-white/50 flex items-center">
              <app-icon name="map-pin" [size]="16" />
            </span>
            <input
              type="text"
              name="adresseLivraison"
              [(ngModel)]="adresseLivraison"
              required
              placeholder="Quartier, Ville, Repère de livraison"
              class="w-full pl-10 pr-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-white/40 text-xs sm:text-sm focus:outline-none focus:border-[var(--color-primary)] focus:bg-white/15"
            />
          </div>
        </div>

        @if (erreur()) {
          <div class="rounded-xl border border-red-400/30 bg-red-500/20 p-3 text-xs text-red-100 flex items-center gap-2">
            <app-icon name="alert-circle" [size]="16" class="text-red-300 shrink-0" />
            <span>{{ erreur() }}</span>
          </div>
        }

        <button
          type="submit"
          [disabled]="chargement()"
          class="btn-primary w-full py-3 rounded-xl text-xs sm:text-sm font-bold shadow-lg disabled:opacity-60 cursor-pointer"
        >
          <app-icon name="check" [size]="16" />
          <span>{{ chargement() ? 'Création en cours...' : "Créer mon compte client" }}</span>
        </button>
      </form>
    </div>
  </div>
</div>
