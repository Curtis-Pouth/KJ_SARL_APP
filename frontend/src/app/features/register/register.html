<div class="min-h-screen flex flex-col items-center bg-[#2B0D0D] px-4 py-10">
  <div class="relative w-24 h-24 mb-4 rounded-full bg-[var(--color-primary)] flex items-center justify-center overflow-hidden shadow-lg">
    <span class="text-[#2B0D0D] font-bold text-2xl">KJ</span>
    <img src="logo-kj-sarl.png" alt="KJ SARL" class="absolute inset-0 w-full h-full object-contain bg-white" onerror="this.style.display='none'" />
  </div>

  <h1 class="text-2xl font-bold text-white tracking-wide">K.J SARL</h1>
  <p class="text-sm text-[var(--color-primary-light)] italic mb-8">Votre satisfaction, notre plaisir</p>

  <div class="w-full max-w-sm">
    <div class="flex bg-white/10 rounded-full p-1 mb-6">
      <a routerLink="/login" class="flex-1 text-center py-2.5 rounded-full text-sm font-semibold text-white/70 hover:text-white transition-colors">
        Connexion
      </a>
      <span class="flex-1 text-center py-2.5 rounded-full text-sm font-semibold bg-[var(--color-primary)] text-[#2B0D0D]">
        Inscription
      </span>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div class="relative">
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-[#2B0D0D]/50">&#128100;</span>
        <input
          type="text" name="nom" [(ngModel)]="nom" required
          placeholder="Nom complet"
          class="w-full pl-10 pr-4 py-3.5 rounded-full bg-[var(--color-primary-light)] text-[#2B0D0D] placeholder-[#2B0D0D]/50 focus:outline-none focus:ring-2 focus:ring-white/50"
        />
      </div>

      <div class="relative">
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-[#2B0D0D]/50">@</span>
        <input
          type="email" name="email" [(ngModel)]="email" required
          placeholder="Adresse email" autocomplete="email"
          class="w-full pl-10 pr-4 py-3.5 rounded-full bg-[var(--color-primary-light)] text-[#2B0D0D] placeholder-[#2B0D0D]/50 focus:outline-none focus:ring-2 focus:ring-white/50"
        />
      </div>

      <div class="relative">
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-[#2B0D0D]/50">&#128274;</span>
        <input
          [type]="motDePasseVisible() ? 'text' : 'password'"
          name="motDePasse" [(ngModel)]="motDePasse" required minlength="8"
          placeholder="Mot de passe (8 caracteres min.)" autocomplete="new-password"
          class="w-full pl-10 pr-12 py-3.5 rounded-full bg-[var(--color-primary-light)] text-[#2B0D0D] placeholder-[#2B0D0D]/50 focus:outline-none focus:ring-2 focus:ring-white/50"
        />
        <button
          type="button" (click)="basculerVisibiliteMotDePasse()"
          class="absolute right-4 top-1/2 -translate-y-1/2 text-[#2B0D0D]/60 hover:text-[#2B0D0D] transition-colors"
          [attr.aria-label]="motDePasseVisible() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
        >
          @if (motDePasseVisible()) {
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 3l18 18M10.58 10.58a2 2 0 0 0 2.83 2.83M9.88 4.24A9.77 9.77 0 0 1 12 4c5 0 9 4.5 10 8-.36 1.12-1 2.24-1.83 3.24M6.1 6.1C3.9 7.5 2.36 9.5 2 12c1 3.5 5 8 10 8 1.5 0 2.9-.36 4.14-1" />
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 12s4-8 10-8 10 8 10 8-4 8-10 8-10-8-10-8Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          }
        </button>
      </div>

      <div class="relative">
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-[#2B0D0D]/50">&#128205;</span>
        <input
          type="text" name="adresseLivraison" [(ngModel)]="adresseLivraison" required
          placeholder="Adresse de livraison"
          class="w-full pl-10 pr-4 py-3.5 rounded-full bg-[var(--color-primary-light)] text-[#2B0D0D] placeholder-[#2B0D0D]/50 focus:outline-none focus:ring-2 focus:ring-white/50"
        />
      </div>

      @if (erreur()) {
        <p class="text-red-300 text-sm text-center">{{ erreur() }}</p>
      }

      <button
        type="submit" [disabled]="chargement()"
        class="w-full py-3.5 rounded-full font-semibold text-white bg-[var(--color-secondary)] hover:bg-[var(--color-secondary-dark)] disabled:opacity-60 transition-colors shadow-md"
      >
        {{ chargement() ? 'Creation...' : "S'inscrire" }}
      </button>
    </form>
  </div>
</div>
