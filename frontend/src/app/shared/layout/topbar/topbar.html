<header class="app-topbar bg-white border-b border-[var(--color-border-soft)] flex items-center justify-between gap-4 px-4 sm:px-7">
  <div class="flex items-center gap-3 shrink-0">
    <div class="relative w-10 h-10 rounded-xl bg-white border border-[var(--color-border-soft)] flex items-center justify-center overflow-hidden shadow-xs">
      <img src="/logo-kj-sarl.jpeg" alt="KJ SARL" class="w-full h-full object-cover" />
    </div>
    <div class="leading-tight hidden sm:block">
      <p class="font-bold text-[var(--color-secondary)] text-sm tracking-wide flex items-center gap-1.5">
        KJ SARL
        <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
      </p>
      <p class="text-[10px] text-[var(--color-text-muted)] font-medium">Distribution & Gestion Pro</p>
    </div>
  </div>

  <form class="app-search hidden md:flex" (ngSubmit)="lancerRecherche()">
    <span class="app-search-icon text-[var(--color-text-muted)]" aria-hidden="true">
      <app-icon name="search" [size]="16" />
    </span>
    <input [(ngModel)]="recherche" name="recherche" type="search" placeholder="Rechercher un produit, une référence, un lot..." />
    <kbd class="font-sans font-medium">Ctrl K</kbd>
  </form>

  <button type="button" class="app-search-mobile md:hidden" aria-label="Rechercher" (click)="lancerRecherche()">
    <app-icon name="search" [size]="18" />
  </button>

  <div class="flex items-center gap-4 shrink-0">
    <div class="hidden xl:flex items-center gap-2 text-right px-3 py-1.5 rounded-lg bg-[var(--color-bg-alt)] border border-[var(--color-border-soft)]">
      <app-icon name="calendar" [size]="15" class="text-[var(--color-primary)]" />
      <div>
        <p class="text-[9px] uppercase tracking-[0.14em] text-[var(--color-text-muted)] font-bold">Aujourd'hui</p>
        <p class="text-xs font-semibold text-[var(--color-secondary)] capitalize leading-none">{{ dateDuJour }}</p>
      </div>
    </div>

    <a routerLink="/profile" class="flex items-center gap-3 pl-2 sm:pl-3 border-l border-[var(--color-border-soft)] hover:opacity-90 transition-opacity">
      <div class="app-user-avatar shadow-xs">{{ initialesUtilisateur }}</div>
      <div class="hidden text-left md:block">
        <p class="text-[10px] uppercase tracking-[0.14em] text-[var(--color-text-muted)] font-semibold">Compte actif</p>
        <p class="text-xs font-bold text-[var(--color-secondary)] truncate max-w-[140px]">{{ authService.currentUser()?.nom || authService.currentUser()?.email || 'Utilisateur' }}</p>
      </div>
    </a>
  </div>
</header>
